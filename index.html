<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Promedio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="n1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="n2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="n3" step="0.1">

        <button onclick="calcularPromedio()">Calcular</button>

        <p id="resultado-promedio"></p>
        <p id="resultado-estado"></p>
    </div>

<script>
    const cantidadNotas = 3;

    function calcularPromedio() {
        let nota1 = parseFloat(document.getElementById("n1").value);
        let nota2 = parseFloat(document.getElementById("n2").value);
        let nota3 = parseFloat(document.getElementById("n3").value);

        if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
            document.getElementById("resultado-promedio").innerHTML = "Debe ingresar las tres notas.";
            return;
        }

        let promedio = (nota1 + nota2 + nota3) / cantidadNotas;

        document.getElementById("resultado-promedio").innerHTML = "Promedio: " + promedio.toFixed(2);

        if (promedio >= 3.0) {
            document.getElementById("resultado-estado").innerHTML = "Resultado: aprobado";
        } else {
            document.getElementById("resultado-estado").innerHTML = "Resultado: reprobado";
        }

    }

</script>

</body>
</html>
